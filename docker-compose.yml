services:
  db:
    image: mysql:8.0
    container_name: target_db
    # 10초 넘는 SELECT는 서버가 자동으로 중단(폭주 sleep() 주입 쿼리가 쌓여 커넥션 고갈되는 것 방지).
    # SQLi 취약점 자체는 그대로 — 주입은 되되 쿼리가 무한정 서버를 물지 못하게만 상한을 건다.
    command: --max-execution-time=10000
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: target_web
      MYSQL_USER: target_user
      MYSQL_PASSWORD: target_pass
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: target_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: target_web
      DB_USER: target_user
      DB_PASS: target_pass

volumes:
  db_data:
